[[input.prepend_keymap]]
on = ["<Esc>"]
run = "close"
desc = "Cancel input"

[[mgr.prepend_keymap]]
on = ["<S-a>"]
run = "create --dir"
desc = "Create directory"

[[mgr.prepend_keymap]]
on = ["<F2>"]
run = "rename"
desc = "Alias for r"

[[mgr.prepend_keymap]]
on = ["g", "."]
run = "cd ~/.dotfiles"
desc = "Go to ~/.dotfiles"

[[mgr.prepend_keymap]]
on = ["g", "m"]
run = "cd /mnt"
desc = "Go to /mnt"

[[mgr.prepend_keymap]]
on = ["g", "s"]
run = "cd /srv"
desc = "Go to /srv"
